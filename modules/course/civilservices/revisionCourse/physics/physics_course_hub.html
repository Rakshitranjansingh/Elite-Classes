<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Civil Services Physics Revision Course — Elite Classes</title>

    <meta name="application-name" content="Elite Classes">
    <meta name="apple-mobile-web-app-title" content="Elite Classes">
    <link rel="icon" type="image/png" href="../../../../../favicon-32x32.png">
    <link rel="stylesheet" href="../../../../../css/styles.css">

    <style>
        :root {
            --hub-bg: #0b1329;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary-blue: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Top Header (Simple & Minimal) */
        .hub-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }

        .btn-transparent-nav {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-transparent-nav:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Container */
        .hub-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Circular Color Gradient Hero Section */
        .hub-hero-clean {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            text-align: center;
        }

        .hub-gradient-aura {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, rgba(245, 158, 11, 0.12) 45%, rgba(99, 102, 241, 0.03) 70%, transparent 100%);
            filter: blur(36px);
            pointer-events: none;
        }

        .hub-hero-content {
            position: relative;
            z-index: 2;
            max-width: 680px;
            margin: 0 auto;
        }

        .hub-class-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.18);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .hub-title-main {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 6px;
            letter-spacing: -0.3px;
        }

        .hub-sub-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 20px;
            font-weight: 500;
        }

        .hub-horizontal-progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
        }

        .hub-progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .hub-progress-track {
            background: #e2e8f0;
            height: 7px;
            border-radius: 10px;
            overflow: hidden;
        }

        .hub-progress-fill {
            background: linear-gradient(90deg, #2563eb, #10b981);
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        /* Chapters Grid */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .chapter-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
            transition: all 0.2s ease;
        }

        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.1);
            border-color: #93c5fd;
        }

        .chapter-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .chapter-badge {
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.3px;
        }

        .chapter-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .chapter-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .status-pill.not-started {
            background: #f1f5f9;
            color: #64748b;
        }

        .status-pill.in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .status-pill.completed {
            background: #d1fae5;
            color: #065f46;
        }
    </style>
</head>

<body>

    <!-- TOP HEADER (SIMPLE & MINIMAL) -->
    <header class="hub-header">
        <a href="../../../../../student_home.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; cursor:pointer;" title="Return to Student Portal">
            <img src="../../../../../eliteLogo_crest.png" onerror="this.src='../../../../../favicon-32x32.png'" alt="Elite Classes" style="height:30px; width:30px; border-radius:6px;">
            <span style="font-size:15px; font-weight:800; color:#ffffff; letter-spacing:-0.2px;">ELITE CLASSES</span>
        </a>
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="../revision_course_hub.html" class="btn-transparent-nav">
                ← Revision Courses Hub
            </a>
        </div>
    </header>

    <!-- MAIN HUB CONTAINER -->
    <div class="hub-container">

        <!-- OVERALL PROGRESS BAR -->
        <div class="hub-horizontal-progress-box" style="margin-bottom: 24px; background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px 20px; box-shadow:0 2px 8px rgba(15,23,42,0.03);">
            <div class="hub-progress-labels" style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--text-dark); margin-bottom:8px;">
                <span>Overall Syllabus Progress</span>
                <span id="total-progress-pct">0% Completed</span>
            </div>
            <div class="hub-progress-track" style="background:#e2e8f0; height:8px; border-radius:10px; overflow:hidden;">
                <div class="hub-progress-fill" id="total-progress-bar" style="width: 0%; height:100%; border-radius:10px; background:linear-gradient(90deg, #2563eb, #10b981); transition:width 0.6s ease;"></div>
            </div>
        </div>

        <!-- CHAPTERS GRID / EMPTY STATE -->
        <div id="chapters-grid-container" class="chapters-grid">
            <!-- Dynamically populated or displays empty state -->
        </div>

    </div>

    <!-- SUPABASE SDK & SERVICES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../../supabase/config.js"></script>
    <script src="../../../../../supabase/api.js"></script>
    <script src="../../../../../supabase/courseApi.js"></script>

    <script>
        // Physics revision chapters list derived from syllabus
        const CHAPTERS_LIST = [
            {
                num: 1,
                id: 'cs_phy_ch1',
                title: 'Unit, Dimensions and Measurement',
                icon: '📏',
                isLive: true
            },
            {
                num: 2,
                id: 'cs_phy_ch2',
                title: 'Mechanics (Motion, Laws & Gravitation)',
                icon: '⚙️',
                isLive: true
            },
            {
                num: 3,
                id: 'cs_phy_ch3',
                title: 'General Properties of Matter (Elasticity & Fluids)',
                icon: '💧',
                isLive: true
            },
            {
                num: 4,
                id: 'cs_phy_ch4',
                title: 'Heat and Thermodynamics',
                icon: '🔥',
                isLive: true
            },
            {
                num: 5,
                id: 'cs_phy_ch5',
                title: 'Wave Motion & Sound',
                icon: '🔊',
                isLive: true
            },
            {
                num: 6,
                id: 'cs_phy_ch6',
                title: 'Light (Optics, Reflection & Refraction)',
                icon: '💡',
                isLive: true
            },
            {
                num: 7,
                id: 'cs_phy_ch7',
                title: 'Electricity, Magnetism & Modern Physics',
                icon: '⚡',
                isLive: true
            }
        ];

        async function initCourseHub() {
            let activeStudent = null;
            try {
                activeStudent = JSON.parse(localStorage.getItem('ec_active_student'));
            } catch(e) {}

            const studentId = activeStudent ? activeStudent.id : (localStorage.getItem('ec_student_id') || 'st_guest');
            const container = document.getElementById('chapters-grid-container');

            if (!CHAPTERS_LIST || CHAPTERS_LIST.length === 0) {
                container.style.display = 'block';
                container.innerHTML = `
                    <div style="background:#ffffff; border:1.5px dashed #cbd5e1; border-radius:16px; padding:48px 24px; text-align:center; max-width:640px; margin:0 auto; box-shadow:0 2px 8px rgba(0,0,0,0.02);">
                        <div style="font-size:40px; margin-bottom:12px;">⚛️</div>
                        <h3 style="font-size:17px; font-weight:800; color:#0f172a; margin:0 0 6px 0;">Physics Revision Chapters In Development</h3>
                        <p style="font-size:13px; color:#64748b; line-height:1.5; margin:0 0 18px 0;">
                            Physics revision course chapters for Civil Services are being prepared.
                        </p>
                        <a href="../../courses_civilservices.html" class="btn btn-primary btn-sm" style="font-weight:700; padding:8px 16px; font-size:12px; text-decoration:none; display:inline-block;">
                            ← Return to Civil Services Courses
                        </a>
                    </div>
                `;
                return;
            }

            let totalPassedAcrossAll = 0;
            let liveChaptersCount = 0;
            let cardsHtml = '';

            for (const ch of CHAPTERS_LIST) {
                let passedCount = 0;
                if (ch.isLive) {
                    liveChaptersCount++;
                    try {
                        const localKey = `ec_course_prog_${studentId}_${ch.id}`;
                        const prog = JSON.parse(localStorage.getItem(localKey) || '{}');
                        for (const mId in prog) {
                            if (prog[mId] && (prog[mId].passed || prog[mId].is_completed || prog[mId].score >= 7)) {
                                passedCount++;
                            }
                        }
                    } catch(e) {
                        passedCount = 0;
                    }
                    totalPassedAcrossAll += passedCount;
                }

                let statusBadge = '';
                let linkHref = `../../../course_player.html?class=civilservices&course=revisionCourse&subject=physics&chapter=${ch.num}`;
                let cardStyle = '';

                if (!ch.isLive) {
                    statusBadge = '<span class="status-pill not-started" style="background:#f1f5f9; color:#94a3b8;">🔒 Coming Soon</span>';
                    linkHref = 'javascript:void(0);';
                    cardStyle = 'opacity:0.75; cursor:not-allowed;';
                } else if (passedCount === 20) {
                    statusBadge = '<span class="status-pill completed">✓ Mastered (20/20)</span>';
                } else if (passedCount > 0) {
                    statusBadge = `<span class="status-pill in-progress">In Progress (${passedCount}/20)</span>`;
                } else {
                    statusBadge = '<span class="status-pill not-started">Start Learning →</span>';
                }

                cardsHtml += `
                    <a href="${linkHref}" class="chapter-card" style="${cardStyle}" ${!ch.isLive ? 'onclick="alert(\'Chapter ' + ch.num + ' will be unlocked in the next revision cycle.\')"' : ''}>
                        <div>
                            <div class="chapter-card-top">
                                <span class="chapter-badge">Chapter ${String(ch.num).padStart(2, '0')}</span>
                                ${statusBadge}
                            </div>
                            <h3 class="chapter-card-title">${ch.icon || '⚛️'} ${ch.title}</h3>
                            <div class="chapter-card-meta">
                                <span>📘 Complete Theory</span>
                                <span>📝 20 Mastery Quizzes</span>
                                <span>🎯 70% Pass</span>
                            </div>
                        </div>
                    </a>
                `;
            }

            container.innerHTML = cardsHtml;

            // Update overall progress bar
            const totalTarget = liveChaptersCount * 20;
            const overallPct = totalTarget > 0 ? Math.round((totalPassedAcrossAll / totalTarget) * 100) : 0;
            const progBar = document.getElementById('total-progress-bar');
            const progPct = document.getElementById('total-progress-pct');
            if (progBar) progBar.style.width = `${overallPct}%`;
            if (progPct) progPct.textContent = `${overallPct}% Completed (${totalPassedAcrossAll}/${totalTarget} Topics)`;
        }

        document.addEventListener('DOMContentLoaded', initCourseHub);
    </script>
</body>

</html>
