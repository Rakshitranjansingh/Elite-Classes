<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 10 History Interactive Courses Hub — Elite Classes</title>

    <meta name="application-name" content="Elite Classes">
    <meta name="apple-mobile-web-app-title" content="Elite Classes">
    <link rel="icon" type="image/png" href="../../../../favicon-32x32.png">
    <link rel="stylesheet" href="../../../../css/styles.css">

    <style>
        :root {
            --hub-bg: #0b1329;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary-emerald: #b45309;
            --accent-green: #d97706;
            --border-color: #e2e8f0;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Top Header (Simple & Minimal) */
        .hub-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }

        .btn-transparent-nav {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-transparent-nav:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Container */
        .hub-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Circular Color Gradient Hero Section */
        .hub-hero-clean {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            text-align: center;
        }

        .hub-gradient-aura {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(5, 150, 105, 0.1) 45%, rgba(14, 165, 233, 0.03) 70%, transparent 100%);
            filter: blur(36px);
            pointer-events: none;
        }

        .hub-hero-content {
            position: relative;
            z-index: 2;
            max-width: 680px;
            margin: 0 auto;
        }

        .hub-class-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-emerald);
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.18);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .hub-title-main {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 6px;
            letter-spacing: -0.3px;
        }

        .hub-sub-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 20px;
            font-weight: 500;
        }

        .hub-horizontal-progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
        }

        .hub-progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .hub-progress-track {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .hub-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b45309, #d97706);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* Grid of 5 Chapters */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .chapter-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .chapter-card:hover {
            transform: translateY(-2px);
            border-color: #6ee7b7;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.08);
        }

        .chapter-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .chapter-badge {
            background: #fffbeb;
            color: #b45309;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.3px;
        }

        .chapter-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .chapter-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .chapter-progress-section {
            margin-bottom: 16px;
        }

        .chapter-progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 6px;
        }

        .chapter-progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .chapter-progress-fill {
            height: 100%;
            background: #d97706;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .chapter-card-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px dashed #e2e8f0;
            gap: 10px;
        }

        .btn-start-chapter {
            background: #b45309;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .btn-start-chapter:hover {
            background: #92400e;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .status-pill.not-started {
            background: #f1f5f9;
            color: #64748b;
        }

        .status-pill.in-progress {
            background: #fef3c7;
            color: #b45309;
        }

        .status-pill.completed {
            background: #fef3c7;
            color: #92400e;
        }

        @media (max-width: 640px) {
            .hub-header {
                padding: 10px 16px;
            }
            .hub-container {
                padding: 16px 12px 40px;
            }
            .chapters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="hub-header">
        <a href="../../../../student_home.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; cursor:pointer;" title="Return to Student Portal">
            <img src="../../../../eliteLogo_crest.png" onerror="this.src=\'../../../../favicon-32x32.png\'" alt="Elite Classes" style="height:30px; width:30px; border-radius:6px;">
            <span style="font-size:15px; font-weight:800; color:#ffffff; letter-spacing:-0.2px;">ELITE CLASSES</span>
        </a>
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="../courses_class_10.html" class="btn-transparent-nav">
                ← Class 10 Courses
            </a>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="hub-container">

        <!-- OVERALL PROGRESS BAR -->
        <div class="hub-horizontal-progress-box" style="margin-bottom: 24px; background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px 20px; box-shadow:0 2px 8px rgba(15,23,42,0.03);">
            <div class="hub-progress-labels" style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--text-dark); margin-bottom:8px;">
                <span>Overall Syllabus Progress</span>
                <span id="total-progress-pct">0% Completed</span>
            </div>
            <div class="hub-progress-track" style="background:#e2e8f0; height:8px; border-radius:10px; overflow:hidden;">
                <div class="hub-progress-fill" id="total-progress-bar" style="width: 0%; height:100%; border-radius:10px; background:linear-gradient(90deg, #2563eb, #10b981); transition:width 0.6s ease;"></div>
            </div>
        </div>

        <!-- CHAPTERS GRID (5 CHAPTERS) -->
        <div class="chapters-grid" id="chapters-grid-container">
            <!-- Rendered dynamically -->
        </div>

    </div>

    <!-- SUPABASE SDK & SERVICES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../supabase/config.js"></script>
    <script src="../../../../supabase/api.js"></script>
    <script src="../../../../supabase/courseApi.js"></script>

    <script>
        const CHAPTERS_LIST = [
            { num: 1, id: 'c10_hist_ch1', title: 'The Rise of Nationalism in Europe', icon: '🏛️', desc: 'French Revolution, liberal nationalism, 1848 revolutions, German/Italian unification & Balkans.' },
            { num: 2, id: 'c10_hist_ch2', title: 'Nationalism in India', icon: '🇮🇳', desc: 'Satyagraha, Jallianwala Bagh, Non-Cooperation, Civil Disobedience, Salt March & Dalits.' },
            { num: 3, id: 'c10_hist_ch3', title: 'The Making of a Global World', icon: '🗺️', desc: 'Silk routes, colonial conquest, 19th-century trade flows, Great Depression & Bretton Woods.' },
            { num: 4, id: 'c10_hist_ch4', title: 'The Age of Industrialisation', icon: '⚙️', desc: 'Proto-industrialisation, steam power, colonial weavers, early Indian mills & Swadeshi.' },
            { num: 5, id: 'c10_hist_ch5', title: 'Print Culture and the Modern World', icon: '📖', desc: 'Gutenberg press, religious reform, French revolution, Indian print culture & censorship.' }
        ];

        async function initCourseHub() {
            let activeStudent = null;
            try {
                activeStudent = JSON.parse(localStorage.getItem('ec_active_student'));
            } catch(e) {}

            const studentId = activeStudent ? activeStudent.id : (localStorage.getItem('ec_student_id') || 'st_guest');

            // Fetch progress for all 5 chapters
            let totalPassedAcrossAll = 0;
            const container = document.getElementById('chapters-grid-container');
            let cardsHtml = '';

            for (const ch of CHAPTERS_LIST) {
                let passedCount = 0;
                try {
                    // Check CourseDBService cache first
                    const key1 = `ec_course_progress_${studentId}_${ch.id}`;
                    const key2 = `ec_course_prog_${studentId}_${ch.id}`;
                    const prog = JSON.parse(localStorage.getItem(key1) || localStorage.getItem(key2) || '{}');
                    for (const mId in prog) {
                        if (prog[mId] && (prog[mId].passed || prog[mId].is_completed || prog[mId].quiz_score >= 7 || prog[mId].score >= 7)) {
                            passedCount++;
                        }
                    }
                } catch(e) {
                    passedCount = 0;
                }

                totalPassedAcrossAll += passedCount;
                const pct = Math.round((passedCount / 20) * 100);

                let statusBadge = '<span class="status-pill not-started">Not Started</span>';
                let btnText = 'Start →';
                if (passedCount === 20) {
                    statusBadge = '<span class="status-pill completed">✓ Mastered</span>';
                    btnText = 'Review →';
                } else if (passedCount > 0) {
                    statusBadge = `<span class="status-pill in-progress">In Progress (${passedCount}/20)</span>`;
                    btnText = `Resume →`;
                }

                // Check Admin Active/Inactive Status
                const courseStatusMap = JSON.parse(localStorage.getItem('ec_course_status_map') || '{}');
                const isChActive = courseStatusMap[ch.id] !== false && courseStatusMap['class10_history'] !== false;
                if (!isChActive) {
                    statusBadge = '<span class="status-pill" style="background:#fee2e2; color:#991b1b;">🔴 Inactive / Coming Soon</span>';
                    btnText = 'Coming Soon';
                }

                cardsHtml += `
                    <a href="${isChActive ? `course_player.html?chapter=${ch.num}` : 'javascript:void(0)'}" 
                       class="chapter-card ${!isChActive ? 'chapter-inactive' : ''}" 
                       ${!isChActive ? 'onclick="alert(\'This chapter is currently set to inactive by institute administration.\'); return false;" style="opacity:0.75; cursor:not-allowed;"' : ''}>
                        <div>
                            <div class="chapter-card-top">
                                <span class="chapter-badge">Chapter ${String(ch.num).padStart(2, '0')}</span>
                                ${statusBadge}
                            </div>
                            <h3 class="chapter-card-title">${ch.icon} ${ch.title}</h3>
                            <div class="chapter-card-meta">
                                <span>📘 Comprehensive Theory</span>
                                <span>📝 Mastery Quizzes</span>
                                <span>🎯 70% Pass</span>
                            </div>
                            <div class="chapter-progress-section">
                                <div class="chapter-progress-header">
                                    <span>${passedCount} / 20 Topics Mastered</span>
                                    <span>${pct}%</span>
                                </div>
                                <div class="chapter-progress-bar">
                                    <div class="chapter-progress-fill" style="width:${pct}%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="chapter-card-action">
                            <span style="font-size:12px; color:#64748b;">${ch.desc}</span>
                            <button class="btn-start-chapter">${btnText}</button>
                        </div>
                    </a>
                `;
            }

            container.innerHTML = cardsHtml;

            const totalModulesOverall = 5 * 20; // 100
            const overallPct = Math.round((totalPassedAcrossAll / totalModulesOverall) * 100);
            const totalProgressEl = document.getElementById('total-progress-pct');
            if (totalProgressEl) {
                totalProgressEl.textContent = `${overallPct}% Completed`;
            }
            const barEl = document.getElementById('total-progress-bar');
            if (barEl) {
                barEl.style.width = `${overallPct}%`;
            }
        }

        window.addEventListener('DOMContentLoaded', initCourseHub);
    </script>
</body>

</html>
