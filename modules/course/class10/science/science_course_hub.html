<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 10 Science Interactive Courses Hub — Elite Classes</title>

    <meta name="application-name" content="Elite Classes">
    <meta name="apple-mobile-web-app-title" content="Elite Classes">
    <link rel="icon" type="image/png" href="../../../../favicon-32x32.png">
    <link rel="stylesheet" href="../../../../css/styles.css">

    <style>
        :root {
            --hub-bg: #0b1329;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary-blue: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Top Header (Simple & Minimal) */
        .hub-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }

        .btn-transparent-nav {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-transparent-nav:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Container */
        .hub-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Circular Color Gradient Hero Section */
        .hub-hero-clean {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            text-align: center;
        }

        .hub-gradient-aura {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, rgba(16, 185, 129, 0.1) 45%, rgba(99, 102, 241, 0.03) 70%, transparent 100%);
            filter: blur(36px);
            pointer-events: none;
        }

        .hub-hero-content {
            position: relative;
            z-index: 2;
            max-width: 680px;
            margin: 0 auto;
        }

        .hub-class-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.18);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .hub-title-main {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 6px;
            letter-spacing: -0.3px;
        }

        .hub-sub-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 20px;
            font-weight: 500;
        }

        .hub-horizontal-progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
        }

        .hub-progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .hub-progress-track {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .hub-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* Grid of 13 Chapters */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .chapter-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .chapter-card:hover {
            transform: translateY(-2px);
            border-color: #93c5fd;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.08);
        }

        .chapter-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .chapter-badge {
            background: #eff6ff;
            color: #2563eb;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.3px;
        }

        .chapter-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .chapter-card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .chapter-progress-section {
            margin-bottom: 16px;
        }

        .chapter-progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 6px;
        }

        .chapter-progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .chapter-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .chapter-card-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-start-chapter {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chapter-card:hover .btn-start-chapter {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .status-pill.not-started {
            background: #f1f5f9;
            color: #64748b;
        }

        .status-pill.in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .status-pill.completed {
            background: #d1fae5;
            color: #065f46;
        }
    </style>
</head>

<body>

    <!-- TOP HEADER (SIMPLE & MINIMAL) -->
    <header class="hub-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="../../../../student_home.html" class="btn-transparent-nav" title="Back to Student Portal">
                ← Back
            </a>
            <span style="font-size:15px; font-weight:800; color:#f8fafc;">Class 10 Science</span>
        </div>
        <div style="font-size:12px; color:#94a3b8; font-weight:600;" id="hub-student-name">Student Portal</div>
    </header>

    <!-- MAIN HUB CONTAINER -->
    <div class="hub-container">

        <!-- CIRCULAR COLOR GRADIENT HERO SECTION -->
        <div class="hub-hero-clean">
            <div class="hub-gradient-aura" aria-hidden="true"></div>
            <div class="hub-hero-content">
                <div class="hub-class-tag">Class 10 • Science</div>
                <h1 class="hub-title-main">Complete test to unlock new modules</h1>
                <p class="hub-sub-text">13 Chapters • 260 Mini-Modules • 70% Mastery Unlocking</p>
                
                <!-- SINGLE HORIZONTAL PROGRESS BAR -->
                <div class="hub-horizontal-progress-box">
                    <div class="hub-progress-labels">
                        <span>Overall Syllabus Progress</span>
                        <span id="total-progress-pct">0% Completed (0/260 Modules)</span>
                    </div>
                    <div class="hub-progress-track">
                        <div class="hub-progress-fill" id="total-progress-bar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CHAPTERS GRID (13 CHAPTERS) -->
        <div class="chapters-grid" id="chapters-grid-container">
            <!-- Rendered dynamically -->
        </div>

    </div>

    <!-- SUPABASE SDK & SERVICES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../supabase/config.js"></script>
    <script src="../../../../supabase/api.js"></script>
    <script src="../../../../supabase/courseApi.js"></script>

    <script>
        const CHAPTERS_LIST = [
            { num: 1, id: 'c10_sci_ch1', title: 'Chemical Reactions and Equations', icon: '⚗️', desc: 'Types of reactions, balancing equations, oxidation & reduction.' },
            { num: 2, id: 'c10_sci_ch2', title: 'Acids, Bases and Salts', icon: '🧪', desc: 'Indicators, neutralization, pH scale, salts and chlor-alkali process.' },
            { num: 3, id: 'c10_sci_ch3', title: 'Metals and Non-Metals', icon: '🔩', desc: 'Physical/chemical traits, reactivity series, metallurgy & corrosion.' },
            { num: 4, id: 'c10_sci_ch4', title: 'Carbon and its Compounds', icon: '💎', desc: 'Covalent bonding, homologous series, functional groups, soaps.' },
            { num: 5, id: 'c10_sci_ch5', title: 'Life Processes', icon: '🌱', desc: 'Nutrition, respiration, transport in humans/plants, and excretion.' },
            { num: 6, id: 'c10_sci_ch6', title: 'Control and Coordination', icon: '🧠', desc: 'Nervous system, reflex arc, plant tropisms, animal endocrine glands.' },
            { num: 7, id: 'c10_sci_ch7', title: 'How do Organisms Reproduce?', icon: '🌸', desc: 'Asexual/sexual reproduction, flowering plants & human reproduction.' },
            { num: 8, id: 'c10_sci_ch8', title: 'Heredity', icon: '🧬', desc: 'Mendelian genetics, monohybrid/dihybrid crosses & sex determination.' },
            { num: 9, id: 'c10_sci_ch9', title: 'Light – Reflection and Refraction', icon: '🔦', desc: 'Spherical mirrors, ray diagrams, Snell’s law, lenses and power.' },
            { num: 10, id: 'c10_sci_ch10', title: 'The Human Eye and Colourful World', icon: '👁️', desc: 'Defects of vision, prism dispersion, rainbow & atmospheric refraction.' },
            { num: 11, id: 'c10_sci_ch11', title: 'Electricity', icon: '⚡', desc: 'Charge, Ohm’s law, resistance, Joule heating & electric power.' },
            { num: 12, id: 'c10_sci_ch12', title: 'Magnetic Effects of Electric Current', icon: '🧲', desc: 'Magnetic field lines, solenoid, Fleming’s rules & electric motor.' },
            { num: 13, id: 'c10_sci_ch13', title: 'Our Environment', icon: '🌍', desc: 'Ecosystems, trophic levels, 10% law, biomagnification & ozone layer.' }
        ];

        async function initCourseHub() {
            let activeStudent = null;
            try {
                activeStudent = JSON.parse(localStorage.getItem('ec_active_student'));
            } catch(e) {}

            const studentId = activeStudent ? activeStudent.id : (localStorage.getItem('ec_student_id') || 'st_guest');

            // Fetch progress for all 13 chapters
            let totalPassedAcrossAll = 0;
            const container = document.getElementById('chapters-grid-container');
            let cardsHtml = '';

            for (const ch of CHAPTERS_LIST) {
                let passedCount = 0;
                try {
                    const localKey = `ec_course_prog_${studentId}_${ch.id}`;
                    const prog = JSON.parse(localStorage.getItem(localKey) || '{}');
                    for (const mId in prog) {
                        if (prog[mId] && prog[mId].passed) passedCount++;
                    }
                } catch(e) {
                    passedCount = 0;
                }

                totalPassedAcrossAll += passedCount;
                const pct = Math.round((passedCount / 20) * 100);

                let statusBadge = '<span class="status-pill not-started">Not Started</span>';
                let btnText = 'Start →';
                if (passedCount === 20) {
                    statusBadge = '<span class="status-pill completed">✓ Mastered</span>';
                    btnText = 'Review →';
                } else if (passedCount > 0) {
                    statusBadge = `<span class="status-pill in-progress">In Progress (${passedCount}/20)</span>`;
                    btnText = `Resume →`;
                }

                // Check Admin Active/Inactive Status
                const courseStatusMap = JSON.parse(localStorage.getItem('ec_course_status_map') || '{}');
                const isChActive = courseStatusMap[ch.id] !== false && courseStatusMap['class10_science'] !== false;
                if (!isChActive) {
                    statusBadge = '<span class="status-pill" style="background:#fee2e2; color:#991b1b;">🔴 Inactive / Coming Soon</span>';
                    btnText = 'Coming Soon';
                }

                cardsHtml += `
                    <a href="${isChActive ? `course_player.html?chapter=${ch.num}` : 'javascript:void(0)'}" 
                       class="chapter-card ${!isChActive ? 'chapter-inactive' : ''}" 
                       ${!isChActive ? 'onclick="alert(\'This chapter is currently set to inactive by institute administration.\'); return false;" style="opacity:0.75; cursor:not-allowed;"' : ''}>
                        <div>
                            <div class="chapter-card-top">
                                <span class="chapter-badge">Chapter ${String(ch.num).padStart(2, '0')}</span>
                                ${statusBadge}
                            </div>
                            <h3 class="chapter-card-title">${ch.icon} ${ch.title}</h3>
                            <div class="chapter-card-meta">
                                <span>📘 20 Modules</span>
                                <span>📝 200 Questions</span>
                                <span>🎯 70% Pass</span>
                            </div>
                            <div class="chapter-progress-section">
                                <div class="chapter-progress-header">
                                    <span>${passedCount} / 20 Modules Passed</span>
                                    <span>${pct}%</span>
                                </div>
                                <div class="chapter-progress-bar">
                                    <div class="chapter-progress-fill" style="width:${pct}%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="chapter-card-action">
                            <span style="font-size:12px; color:#64748b;">${ch.desc}</span>
                            <button class="btn-start-chapter">${btnText}</button>
                        </div>
                    </a>
                `;
            }

            container.innerHTML = cardsHtml;

            const totalModulesOverall = 13 * 20; // 260
            const overallPct = Math.round((totalPassedAcrossAll / totalModulesOverall) * 100);
            const totalProgressEl = document.getElementById('total-progress-pct');
            if (totalProgressEl) {
                totalProgressEl.textContent = `${overallPct}% Completed (${totalPassedAcrossAll}/260 Modules)`;
            }
            const barEl = document.getElementById('total-progress-bar');
            if (barEl) {
                barEl.style.width = `${overallPct}%`;
            }
        }

        window.addEventListener('DOMContentLoaded', initCourseHub);
    </script>
</body>

</html>
